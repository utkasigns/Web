services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: matrixdb
      POSTGRES_USER: matrix
      POSTGRES_PASSWORD: matrix
    ports:
      - "5433:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: